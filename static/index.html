<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Map Generator</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Georgia', serif;
            background-color: #f4ecd8; /* parchment base */
        }
        #map {
            width: 100%;
            height: 100%;
            background-color: #f4ecd8;
        }
        #ui-container {
            position: absolute;
            top: 10px;
            left: 50px;
            z-index: 1000;
            background: rgba(244, 236, 216, 0.9);
            padding: 15px;
            border: 2px solid #a38c64;
            border-radius: 5px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }
        h2 {
            margin-top: 0;
            font-size: 18px;
            color: #4a3b22;
        }
        .form-group {
            margin-bottom: 10px;
        }
        label {
            display: inline-block;
            width: 60px;
            color: #4a3b22;
            font-size: 14px;
        }
        input[type="number"], input[type="text"] {
            width: 120px;
            padding: 4px;
            border: 1px solid #a38c64;
            background: #fffdf7;
        }
        button {
            background-color: #8c734e;
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 3px;
            font-family: 'Georgia', serif;
        }
        button:hover {
            background-color: #6b5638;
        }
        .toggle-group {
            margin-top: 10px;
            font-size: 14px;
            color: #4a3b22;
        }
        #marker-btn {
            margin-top: 10px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="ui-container">
        <h2>Fantasy Map Settings</h2>
        <div class="form-group">
            <label for="seed-input">Seed:</label>
            <input type="number" id="seed-input" value="12345">
        </div>
        <div class="form-group">
            <label for="x-input">Jump X:</label>
            <input type="number" id="x-input" value="0">
        </div>
        <div class="form-group">
            <label for="z-input">Jump Z:</label>
            <input type="number" id="z-input" value="0">
        </div>
        <hr style="border-top:1px solid #a38c64; margin:10px 0;">
        <p style="font-size:12px; margin: 5px 0; color:#4a3b22;">Bounds (optional):</p>
        <div class="form-group">
            <label for="min-x">Min X:</label>
            <input type="number" id="min-x">
        </div>
        <div class="form-group">
            <label for="max-x">Max X:</label>
            <input type="number" id="max-x">
        </div>
        <div class="form-group">
            <label for="min-z">Min Z:</label>
            <input type="number" id="min-z">
        </div>
        <div class="form-group">
            <label for="max-z">Max Z:</label>
            <input type="number" id="max-z">
        </div>
        <button id="update-btn">Update Map</button>

        <div class="toggle-group">
            <input type="checkbox" id="toggle-trees" checked>
            <label for="toggle-trees" style="width:auto">Show Forests</label><br>

            <input type="checkbox" id="toggle-mountains" checked>
            <label for="toggle-mountains" style="width:auto">Show Mountains</label><br>

            <input type="checkbox" id="toggle-rivers" checked>
            <label for="toggle-rivers" style="width:auto">Show Rivers</label>
        </div>

        <button id="marker-btn">Add Custom Marker</button>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="main.js"></script>
</body>
</html>
